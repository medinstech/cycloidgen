[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cycloidgen"
version = "2.1.0"
description = "Parametric cycloidal drive generator with engineering analysis and CAD export"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Medinstech" }]
keywords = ["cycloidal", "gearbox", "reducer", "cad", "mechanical-design",
            "dxf", "step", "hertz", "backlash"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "ezdxf>=1.1",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "PySide6>=6.6",
    "cadquery>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.5"]

[project.urls]
Homepage = "https://github.com/medinstech/cycloidgen"
Issues = "https://github.com/medinstech/cycloidgen/issues"

[project.scripts]
cycloidgen = "cycloidgen.__main__:main"

[project.gui-scripts]
cycloidgen-gui = "cycloidgen.ui.app:main"

[tool.setuptools.packages.find]
include = ["cycloidgen*"]

# The brand assets are part of the application, not build output - without this
# the window has no icon and the header has no logo in an installed copy.
[tool.setuptools.package-data]
"cycloidgen.ui" = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# Committed so that lint means the same thing here, on another machine and in
# CI.  Without a config in the repository, ruff answers to whatever settings a
# developer's machine happens to carry - which is not a check, it is a
# coincidence.
[tool.ruff]
line-length = 95
target-version = "py310"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "UP",       # outdated idioms
    "B",        # bugbear: real bug shapes, not style
    "C4",       # comprehensions
    "SIM",      # obvious simplifications
    "RUF",      # ruff's own
]
ignore = [
    # The material tables and the check messages read better as one line each
    # than wrapped to satisfy a column count.
    "E501",
    # `except Exception` is deliberate at the worker-thread and export
    # boundaries: the alternative is a traceback the GUI user never sees.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# matplotlib's backend has to be selected before its pyplot-adjacent imports,
# and the Qt platform before PySide6 is imported at all, so these modules
# genuinely cannot put every import at the top.
"cycloidgen/ui/main_window.py" = ["E402"]
"cycloidgen/report/plots.py" = ["E402"]
"tests/*" = ["E402"]
"docs/make_figures.py" = ["E402"]
