blank_issues_enabled: true
contact_links:
  - name: Measured a drive you built?
    url: https://github.com/medinstech/cycloidgen/issues/new?labels=calibration
    about: >
      Predicted versus measured is the item at the top of the roadmap and is
      worth more than everything under it. Lost motion, stiffness, efficiency,
      running temperature, failure torque - open an issue with what you built
      and what you measured.
