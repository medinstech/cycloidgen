name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.10"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PySide6 links against these even when it never opens a window, so the
      # offscreen platform plugin fails to load without them and every Qt test
      # errors at import.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: python -m pytest -q --durations=10

  cli:
    name: headless run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The tests exercise the pieces; this proves the whole thing still runs
      # end to end and writes the files it claims to.
      - name: Export a bundle
        env:
          MPLBACKEND: Agg
        run: |
          python -m cycloidgen --ratio 29 --out ./_ci_out
          test -f ./_ci_out/report.pdf
          test -f ./_ci_out/bom.csv
          test -f ./_ci_out/dxf/disc_1.dxf
          test -f ./_ci_out/assembly.step
          ls -R ./_ci_out

      - name: Search for a design
        env:
          MPLBACKEND: Agg
        run: |
          python -m cycloidgen --optimise --ratio 29 --torque 20 --rpm 1500 \
            --max-od 120 --process "CNC machined" \
            --disc-material "Steel 4140 (hardened)" \
            --pin-material "Bearing steel 100Cr6" --rollers --effort quick

      # Not compared against the committed PNGs - font rasterisation differs
      # between platforms, so the bytes would never match and the check would
      # cry wolf on every run.  This just proves the plotting API still works.
      - name: Regenerate the README figures
        env:
          MPLBACKEND: Agg
        run: |
          python docs/make_figures.py
          test -s docs/drawing.png
          test -s docs/tradestudy.png
