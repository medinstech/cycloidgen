name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Rules live in pyproject.toml, so this checks the same thing a developer
      # gets locally.  `ruff format` is deliberately not run: the repository has
      # a hand-aligned style the formatter would rewrite wholesale, and a lint
      # that hunts bugs is worth more than one that enforces a preference.
      - run: pipx install ruff
      - run: ruff check --output-format=github .

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          # Apple silicon.  There is no macOS package yet, but the application
          # is pure Python on cross-platform wheels and "it should work" is not
          # a claim worth making without a run behind it.
          - os: macos-latest
            python: "3.12"
          # The oldest supported interpreter, and the one that earns its place:
          # it ships an older matplotlib, and it is the configuration that
          # caught the animation sizing its frame buffer from the wrong number.
          - os: ubuntu-latest
            python: "3.10"
          # The two ends of the range are where a claim of support is either
          # made or withdrawn, so both are run rather than assumed.  3.12 stays
          # the middle of it and the one every bundle is frozen on; these say
          # the source is not tied to it.
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          # And the newest on Windows as well, because that is the platform the
          # wheels are least alike on: OCCT and VTK arrive as binaries built per
          # interpreter, and "it resolved on Linux" is not the same claim.
          - os: windows-latest
            python: "3.14"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PySide6 links against these even when it never opens a window, so the
      # offscreen platform plugin fails to load without them and every Qt test
      # errors at import.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: python -m pytest -q --durations=10

  # The real installer takes half an hour, almost all of it compressing a
  # 790 MB bundle, so it only runs on a tag.  Compiling the script against
  # a stub folder takes seconds and catches everything that is actually likely
  # to break: a page order, a missing translation, a path that moved, or the
  # version no longer being where !searchparse looks for it.
  installer:
    name: installer script
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: choco install nsis --no-progress -y
      - name: Compile against a stub bundle
        shell: pwsh
        run: |
          $stub = "$env:RUNNER_TEMP\stub"
          New-Item -ItemType Directory -Force $stub | Out-Null
          Set-Content "$stub\cycloidgen.exe" "stub"
          # `releases/` is gitignored, so it is never in a fresh checkout, and
          # NSIS will not create the folder its OutFile lives in: it fails with
          # "Can't open output file".
          New-Item -ItemType Directory -Force releases | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 /INPUTCHARSET UTF8 /DFASTPACK "/DBUILD_DIR=$stub" packaging\cycloidgen.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          $setup = Get-ChildItem releases\*.exe
          "built $($setup.Name)"
          $version = (Select-String -Path cycloidgen\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($setup.Name -ne "cycloidgen_v${version}_Setup.exe") {
            throw "installer is named $($setup.Name) but the source says $version"
          }

  cli:
    name: headless run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The tests exercise the pieces; this proves the whole thing still runs
      # end to end and writes the files it claims to.
      - name: Export a bundle
        env:
          MPLBACKEND: Agg
        run: |
          python -m cycloidgen --ratio 29 --list-outputs
          python -m cycloidgen --ratio 29 --out ./_ci_out
          test -f ./_ci_out/report.pdf
          test -f ./_ci_out/bom.csv
          test -f ./_ci_out/dxf/disc_1.dxf
          test -f ./_ci_out/assembly.step
          ls -R ./_ci_out

      # The group selection is the path a machine without OCCT has to take, so
      # it is worth proving separately that it produces drawings and a report
      # and does not reach for the kernel.
      - name: Export drawings and data only
        env:
          MPLBACKEND: Agg
        run: |
          python -m cycloidgen --ratio 29 --only drawings,data --out ./_ci_2d
          test -f ./_ci_2d/report.pdf
          test -f ./_ci_2d/disc.svg
          test ! -d ./_ci_2d/step
          test ! -d ./_ci_2d/stl

      - name: Search for a design
        env:
          MPLBACKEND: Agg
        run: |
          python -m cycloidgen --optimise --ratio 29 --torque 20 --rpm 1500 \
            --max-od 120 --process "CNC machined" \
            --disc-material "Steel 4140 (hardened)" \
            --pin-material "Bearing steel 100Cr6" --rollers --effort quick

      # Not compared against the committed PNGs - font rasterisation differs
      # between platforms, so the bytes would never match and the check would
      # cry wolf on every run.  This just proves the plotting API still works.
      - name: Regenerate the README figures
        env:
          MPLBACKEND: Agg
        run: |
          python docs/make_figures.py
          test -s docs/drawing.png
          test -s docs/tradestudy.png
