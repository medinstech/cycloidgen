name: release

# Tag-driven, and the tag is checked against the version in the source rather
# than trusted.  A `v2.3.0` tag on a tree that still says 2.2.0 would otherwise
# publish an installer that disagrees with its own file properties, and nothing
# downstream would notice.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the installer but do not publish a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    # The bundle is about 790 MB - mostly VTK and OCCT - and LZMA over that is
    # most of the wall clock here.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check the tag against the source
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          source_version=$(python -c "import cycloidgen; print(cycloidgen.__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag $tag_version, source $source_version"
          if [ "$source_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match cycloidgen.__version__ ($source_version)"
            exit 1
          fi
          grep -q "^## $source_version\$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for $source_version"; exit 1; }

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: |
          python -m ruff check .
          python -m pytest -q

      - name: Build the bundle
        run: python -m PyInstaller cycloidgen.spec --noconfirm

      # Not just "did a file appear": the executable is asked what version it
      # thinks it is, which is the one thing that catches packaging a stale
      # dist\ from an earlier run.
      - name: Check the bundle
        shell: bash
        run: |
          # Both are built; only the console one can be asked anything.
          test -f ./dist/cycloidgen/cycloidgen.exe
          ./dist/cycloidgen/cycloidgen-cli.exe --version
          ./dist/cycloidgen/cycloidgen-cli.exe --ratio 21 --list-outputs > /dev/null

      - name: Install NSIS
        shell: pwsh
        # Chocolatey's community feed answers 503 often enough to have taken a
        # release down: it did on 7.3.2, in this step, after the bundle and
        # every other platform's build had already succeeded.  Nothing about
        # that failure is ours and nothing about it is worth a person's
        # attention, so it is retried rather than reported.
        run: |
          foreach ($attempt in 1..4) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "chocolatey exited $LASTEXITCODE on attempt $attempt"
            Start-Sleep -Seconds (20 * $attempt)
          }
          throw "NSIS would not install in four attempts"

      # In pwsh, and not in bash, because NSIS takes `/FLAG` options and MSYS
      # rewrites anything shaped like a Unix path: `/INPUTCHARSET` arrives as
      # `C:/Program Files/Git/INPUTCHARSET` and makensis reads it as the script
      # to compile.  The installer job in tests.yml has always spelled this in
      # pwsh, which is why it passed while this one fell over - the two were
      # running the same command in two shells and only one of them mangles it.
      - name: Build the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force releases | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /INPUTCHARSET UTF8 packaging\cycloidgen.nsi
          # A native command that fails does not stop a pwsh step by itself.
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Get-ChildItem releases | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: cycloidgen-windows-installer
          path: releases/*.exe
          retention-days: 14

      # The release notes are the changelog section for this version, so the
      # two cannot say different things about what shipped.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Written from Python rather than redirected from its stdout.  The
          # changelog is UTF-8 and carries characters like the menu arrow;
          # stdout on a Windows runner is the locale encoding, so a redirect
          # takes the publish step down with a UnicodeEncodeError - after the
          # bundle and the installer have already been built.
          python - <<'PY'
          import pathlib, re
          import cycloidgen
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.split(rf"^## {re.escape(cycloidgen.__version__)}$",
                             text, maxsplit=1, flags=re.MULTILINE)[1]
          notes = re.split(r"^## ", section, maxsplit=1, flags=re.MULTILINE)[0].strip()
          pathlib.Path("notes.md").write_text(notes + chr(10), encoding="utf-8")
          PY
          cat >> notes.md <<'EOF'

          ---
          **Windows** - `cycloidgen_..._Setup.exe`. It is unsigned, so
          SmartScreen will warn on first run: **More info -> Run anyway**. A
          signed build is planned.

          **Linux** - `cycloidgen-...-x86_64.AppImage`. `chmod +x` and run it;
          it needs glibc 2.35 or newer. If it will not start, the machine has no
          FUSE 2: install `libfuse2`, or run the file with
          `--appimage-extract-and-run`, which unpacks it instead of mounting it.

          **macOS** - `cycloidgen-...-arm64.dmg`, Apple silicon. Drag it to
          Applications, then run this **before opening it**:

          ```
          xattr -dr com.apple.quarantine /Applications/cycloidgen.app
          ```

          It is signed ad-hoc but not notarized, so Gatekeeper blocks the first
          launch. On macOS 15 and later the dialog it raises defaults to
          **Move to Trash**, which deletes the install - there is no *Open
          Anyway* in that dialog, it appears in System Settings only after a
          launch has been blocked, and right-click -> Open no longer bypasses
          it. Clearing the flag first avoids the dialog entirely. On an Intel
          Mac, use pip.

          **Anywhere with Python 3.10-3.14**: `pip install cycloidgen`, then
          `cycloidgen`.

          The numbers this produces are preliminary sizing estimates, not a
          certification. Validate against a physical prototype before anything
          load-bearing depends on them.
          EOF
          gh release create "$GITHUB_REF_NAME" releases/*.exe \
            --title "cycloidgen $GITHUB_REF_NAME" --notes-file notes.md

  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    # 22.04 deliberately, not `ubuntu-latest`.  A PyInstaller bundle carries
    # Python and Qt but links against the host's glibc, and glibc is forward
    # compatible only: built on 24.04 it needs 2.39, which rules out Debian 12,
    # Ubuntu 22.04 LTS and every enterprise distribution in service.  Built here
    # it needs 2.35 and runs on all of them.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # PySide6 links against these even when it never opens a window, so the
      # offscreen platform plugin fails to load without them and the smoke test
      # below cannot run.  Same list as tests.yml, for the same reason.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check the tag against the source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          source_version=$(python -c "import cycloidgen; print(cycloidgen.__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$source_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match cycloidgen.__version__ ($source_version)"
            exit 1
          fi

      - name: Build the bundle
        run: python -m PyInstaller cycloidgen.spec --noconfirm

      # One executable here, not two: `console` is a Windows subsystem flag and
      # has no meaning on Linux, so the spec builds a single binary.
      - name: Check the bundle
        run: |
          test -x ./dist/cycloidgen/cycloidgen
          test ! -e ./dist/cycloidgen/cycloidgen-cli
          ./dist/cycloidgen/cycloidgen --version
          ./dist/cycloidgen/cycloidgen --ratio 21 --list-outputs > /dev/null

      # Through `bash` rather than as `packaging/appimage.sh`.  The executable
      # bit is in the index, but this repository is developed on Windows, where
      # git's core.filemode is off by default - so a future edit that recreates
      # the file loses the bit silently, and the failure is a release that dies
      # here with "permission denied" half an hour in.  Naming the interpreter
      # costs five characters and cannot be lost.
      - name: Build the AppImage
        run: bash packaging/appimage.sh

      # The one check worth having: the artefact that is about to be published is
      # unpacked and run.  A bundle that builds and cannot start is the whole
      # failure mode here, and it is invisible until somebody downloads it.
      #
      # Extracted once rather than run twice under APPIMAGE_EXTRACT_AND_RUN: the
      # runner has no FUSE to mount the image with, and that variable unpacks
      # the whole bundle again on every invocation.  `--appimage-extract` is a
      # flag of the runtime itself and needs no FUSE either.
      - name: Run the AppImage
        env:
          MPLBACKEND: Agg
        run: |
          image=$(ls releases/*.AppImage)
          chmod +x "$image"
          "$image" --appimage-extract > /dev/null
          reported=$(./squashfs-root/AppRun --version)
          echo "$reported"
          test "$reported" = "cycloidgen $(python -c 'import cycloidgen; print(cycloidgen.__version__)')"
          ./squashfs-root/AppRun --ratio 21 --only drawings,data --out ./_appimage_out
          test -f ./_appimage_out/report.pdf
          rm -rf squashfs-root

      - uses: actions/upload-artifact@v4
        with:
          name: cycloidgen-linux-appimage
          path: releases/*.AppImage
          retention-days: 14

  macos:
    name: macOS disk image
    runs-on: macos-15
    # Apple silicon, and only Apple silicon.  Every x86-64 macOS label GitHub
    # offers is a *larger runner* - `macos-15-intel`, `macos-15-large` - which is
    # a paid tier, and the free Intel image was retired.  An Intel Mac gets `pip
    # install cycloidgen`, which is the same application.
    #
    # Pinned to 15 rather than `macos-latest` for the reason the Linux job is
    # pinned to 22.04: `-latest` moves under you, and an SDK is a compatibility
    # floor you do not want raised by somebody else's release schedule.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check the tag against the source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          source_version=$(python -c "import cycloidgen; print(cycloidgen.__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$source_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match cycloidgen.__version__ ($source_version)"
            exit 1
          fi

      - name: Build the bundle
        run: python -m PyInstaller cycloidgen.spec --noconfirm

      # A .app is a folder, so "did it build" is not the question - "does the
      # binary inside it run" is.  Unlike Windows, a windowed macOS build still
      # has stdio when it is started from a shell, so it can simply be asked.
      - name: Check the bundle
        env:
          MPLBACKEND: Agg
        run: |
          test -d ./dist/cycloidgen.app
          test -f ./dist/cycloidgen.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            ./dist/cycloidgen.app/Contents/Info.plist
          ./dist/cycloidgen.app/Contents/MacOS/cycloidgen --version
          ./dist/cycloidgen.app/Contents/MacOS/cycloidgen --ratio 21 --list-outputs > /dev/null

      - name: Build the disk image
        run: bash packaging/macos.sh

      # Mounted and run out of the mounted volume, which is the last state
      # anything is in before a user sees it.  A disk image that builds and
      # carries a bundle that will not start is the whole failure mode here.
      - name: Mount it and run what is inside
        env:
          MPLBACKEND: Agg
        run: |
          image=$(ls releases/*.dmg)
          hdiutil attach "$image" -mountpoint /Volumes/cycloidgen -nobrowse -quiet

          # The signature of the *copy*, which is the only place it can have
          # been lost.  `packaging/macos.sh` verifies the bundle it was handed;
          # this verifies the one that came out the other end of `ditto` and
          # `hdiutil`.  Running the binary would not catch it - on arm64 the
          # kernel checks the signature embedded in the Mach-O, and the
          # signatures that a copy actually drops are the ones stored in
          # extended attributes for everything that is not one.
          codesign --verify --verbose=1 /Volumes/cycloidgen/cycloidgen.app

          app=/Volumes/cycloidgen/cycloidgen.app/Contents/MacOS/cycloidgen
          reported=$("$app" --version)
          echo "$reported"
          test "$reported" = "cycloidgen $(python -c 'import cycloidgen; print(cycloidgen.__version__)')"
          "$app" --ratio 21 --only drawings,data --out "$RUNNER_TEMP/_dmg_out"
          test -f "$RUNNER_TEMP/_dmg_out/report.pdf"
          test -L /Volumes/cycloidgen/Applications
          hdiutil detach /Volumes/cycloidgen -quiet

      - uses: actions/upload-artifact@v4
        with:
          name: cycloidgen-macos-dmg
          path: releases/*.dmg
          retention-days: 14

  # The AppImage and the disk image go onto the release the Windows job creates,
  # so this waits for all three - two jobs racing to `gh release create` is how a
  # release ends up with half its assets and the wrong notes.  It is a job of its
  # own rather than a step on the end of each build so that the three bundles
  # still build side by side: half an hour each, and if the Windows job is going
  # to fail it should not also cost us the answer to whether the others do.
  attach-bundles:
    name: Attach the other bundles
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Named one at a time rather than by pattern: `cycloidgen-*` would also
      # pull down the Windows installer, which is 230 MB and already on the
      # release.
      - uses: actions/download-artifact@v4
        with:
          name: cycloidgen-linux-appimage
          path: releases
      - uses: actions/download-artifact@v4
        with:
          name: cycloidgen-macos-dmg
          path: releases
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l releases/
          gh release upload "$GITHUB_REF_NAME" \
            releases/*.AppImage releases/*.dmg --clobber \
            --repo "$GITHUB_REPOSITORY"

  # The other half of "how do I run this": the installer is Windows-only and
  # always will be - NSIS is a Windows tool - but the application is not, and it
  # is tested on Linux and macOS on every push.  A wheel is the one artefact
  # that covers all three, and `cadquery-ocp` ships wheels for every platform
  # and architecture this runs on, so `pip install cycloidgen` needs no
  # compiler anywhere.
  #
  # Behind the Windows job on purpose. That job is the gate - it runs ruff and
  # the full suite, and checks the tag against the source and the changelog -
  # and a version on PyPI cannot be replaced, only yanked. Waiting half an hour
  # to publish something permanent is the right trade.
  pypi:
    name: PyPI
    needs: windows
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC token against a
      # publisher it has on file, so there is no API token in the repository to
      # leak, rotate or forget.  Configured once at
      # pypi.org/manage/project/cycloidgen/settings/publishing - see RELEASING.md.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the wheel and the sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # `twine check` renders the long description the way PyPI will, which is
      # the one failure that cannot be undone: a broken README on a version that
      # is already published stays broken until the next release.
      - name: Check what is about to be published
        run: |
          python -m twine check --strict dist/*
          ls -l dist/
          test -n "$(ls dist/*.whl)"
          test -n "$(ls dist/*.tar.gz)"

      # The name has to carry the tag, or the wheel is a different version from
      # the installer published two steps up.
      - name: Check the wheel against the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/cycloidgen-${version}-py3-none-any.whl" \
            || { echo "::error::no wheel for $version in dist/"; ls dist/; exit 1; }

      - uses: pypa/gh-action-pypi-publish@release/v1
