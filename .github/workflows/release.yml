name: release

# Tag-driven, and the tag is checked against the version in the source rather
# than trusted.  A `v2.3.0` tag on a tree that still says 2.2.0 would otherwise
# publish an installer that disagrees with its own file properties, and nothing
# downstream would notice.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the installer but do not publish a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    # The bundle is about 1.2 GB, essentially all OCCT, and LZMA over that is
    # most of the wall clock here.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check the tag against the source
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          source_version=$(python -c "import cycloidgen; print(cycloidgen.__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag $tag_version, source $source_version"
          if [ "$source_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match cycloidgen.__version__ ($source_version)"
            exit 1
          fi
          grep -q "^## $source_version\$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for $source_version"; exit 1; }

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: |
          python -m ruff check .
          python -m pytest -q

      - name: Build the bundle
        run: python -m PyInstaller cycloidgen.spec --noconfirm

      # Not just "did a file appear": the executable is asked what version it
      # thinks it is, which is the one thing that catches packaging a stale
      # dist\ from an earlier run.
      - name: Check the bundle
        shell: bash
        run: |
          # Both are built; only the console one can be asked anything.
          test -f ./dist/cycloidgen/cycloidgen.exe
          ./dist/cycloidgen/cycloidgen-cli.exe --version
          ./dist/cycloidgen/cycloidgen-cli.exe --ratio 21 --list-outputs > /dev/null

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      # In pwsh, and not in bash, because NSIS takes `/FLAG` options and MSYS
      # rewrites anything shaped like a Unix path: `/INPUTCHARSET` arrives as
      # `C:/Program Files/Git/INPUTCHARSET` and makensis reads it as the script
      # to compile.  The installer job in tests.yml has always spelled this in
      # pwsh, which is why it passed while this one fell over - the two were
      # running the same command in two shells and only one of them mangles it.
      - name: Build the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force releases | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /INPUTCHARSET UTF8 packaging\cycloidgen.nsi
          # A native command that fails does not stop a pwsh step by itself.
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Get-ChildItem releases | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: cycloidgen-windows-installer
          path: releases/*.exe
          retention-days: 14

      # The release notes are the changelog section for this version, so the
      # two cannot say different things about what shipped.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Written from Python rather than redirected from its stdout.  The
          # changelog is UTF-8 and carries characters like the menu arrow;
          # stdout on a Windows runner is the locale encoding, so a redirect
          # takes the publish step down with a UnicodeEncodeError - after the
          # bundle and the installer have already been built.
          python - <<'PY'
          import pathlib, re
          import cycloidgen
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.split(rf"^## {re.escape(cycloidgen.__version__)}$",
                             text, maxsplit=1, flags=re.MULTILINE)[1]
          notes = re.split(r"^## ", section, maxsplit=1, flags=re.MULTILINE)[0].strip()
          pathlib.Path("notes.md").write_text(notes + chr(10), encoding="utf-8")
          PY
          cat >> notes.md <<'EOF'

          ---
          The installer is unsigned, so Windows SmartScreen will warn on first
          run: **More info -> Run anyway**. A signed build is planned.

          The numbers this produces are preliminary sizing estimates, not a
          certification. Validate against a physical prototype before anything
          load-bearing depends on them.
          EOF
          gh release create "$GITHUB_REF_NAME" releases/*.exe \
            --title "cycloidgen $GITHUB_REF_NAME" --notes-file notes.md

  # The other half of "how do I run this": the installer is Windows-only and
  # always will be - NSIS is a Windows tool - but the application is not, and it
  # is tested on Linux and macOS on every push.  A wheel is the one artefact
  # that covers all three, and `cadquery-ocp` ships wheels for every platform
  # and architecture this runs on, so `pip install cycloidgen` needs no
  # compiler anywhere.
  #
  # Behind the Windows job on purpose. That job is the gate - it runs ruff and
  # the full suite, and checks the tag against the source and the changelog -
  # and a version on PyPI cannot be replaced, only yanked. Waiting half an hour
  # to publish something permanent is the right trade.
  pypi:
    name: PyPI
    needs: windows
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC token against a
      # publisher it has on file, so there is no API token in the repository to
      # leak, rotate or forget.  Configured once at
      # pypi.org/manage/project/cycloidgen/settings/publishing - see RELEASING.md.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the wheel and the sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # `twine check` renders the long description the way PyPI will, which is
      # the one failure that cannot be undone: a broken README on a version that
      # is already published stays broken until the next release.
      - name: Check what is about to be published
        run: |
          python -m twine check --strict dist/*
          ls -l dist/
          test -n "$(ls dist/*.whl)"
          test -n "$(ls dist/*.tar.gz)"

      # The name has to carry the tag, or the wheel is a different version from
      # the installer published two steps up.
      - name: Check the wheel against the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/cycloidgen-${version}-py3-none-any.whl" \
            || { echo "::error::no wheel for $version in dist/"; ls dist/; exit 1; }

      - uses: pypa/gh-action-pypi-publish@release/v1
